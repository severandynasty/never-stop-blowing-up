<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Gradient Definitions -->
        <linearGradient id="combatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#f44336;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#ff9800;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="stealthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#9c27b0;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#3f51b5;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="socialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#e91e63;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#ff4081;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#00bcd4;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#4caf50;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="vehicleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ff9800;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#ffeb3b;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="tokenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ffeb3b;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#ffc107;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="groupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#e91e63;stop-opacity:1" />
            <stop offset="33%" style="stop-color:#00bcd4;stop-opacity:1" />
            <stop offset="66%" style="stop-color:#ff9800;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#9c27b0;stop-opacity:1" />
        </linearGradient>
        
        <!-- Glow Effects -->
        <filter id="neonGlow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge> 
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        
        <!-- Retro Grid Pattern -->
        <pattern id="retroGrid" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
            <path d="M 8 0 L 0 0 0 8" fill="none" stroke="rgba(0, 188, 212, 0.3)" stroke-width="0.5"/>
        </pattern>
    </defs>
    
    <!-- Background -->
    <rect width="64" height="64" fill="#1a1a2e" rx="4"/>
    
    <!-- Retro Grid Overlay -->
    <rect width="64" height="64" fill="url(#retroGrid)" opacity="0.3"/>
    <!-- Scanlines -->
    <g opacity="0.1">
        <line x1="0" y1="0" x2="64" y2="0" stroke="#00bcd4" stroke-width="0.5"/><line x1="0" y1="4" x2="64" y2="4" stroke="#00bcd4" stroke-width="0.5"/><line x1="0" y1="8" x2="64" y2="8" stroke="#00bcd4" stroke-width="0.5"/><line x1="0" y1="12" x2="64" y2="12" stroke="#00bcd4" stroke-width="0.5"/><line x1="0" y1="16" x2="64" y2="16" stroke="#00bcd4" stroke-width="0.5"/><line x1="0" y1="20" x2="64" y2="20" stroke="#00bcd4" stroke-width="0.5"/><line x1="0" y1="24" x2="64" y2="24" stroke="#00bcd4" stroke-width="0.5"/><line x1="0" y1="28" x2="64" y2="28" stroke="#00bcd4" stroke-width="0.5"/><line x1="0" y1="32" x2="64" y2="32" stroke="#00bcd4" stroke-width="0.5"/><line x1="0" y1="36" x2="64" y2="36" stroke="#00bcd4" stroke-width="0.5"/><line x1="0" y1="40" x2="64" y2="40" stroke="#00bcd4" stroke-width="0.5"/><line x1="0" y1="44" x2="64" y2="44" stroke="#00bcd4" stroke-width="0.5"/><line x1="0" y1="48" x2="64" y2="48" stroke="#00bcd4" stroke-width="0.5"/><line x1="0" y1="52" x2="64" y2="52" stroke="#00bcd4" stroke-width="0.5"/><line x1="0" y1="56" x2="64" y2="56" stroke="#00bcd4" stroke-width="0.5"/><line x1="0" y1="60" x2="64" y2="60" stroke="#00bcd4" stroke-width="0.5"/>
    </g><!-- Stick figure in steady, unshakeable pose -->
                               <circle cx="32" cy="16" r="3" fill="#9c27b0" filter="url(#neonGlow)"/>
                               <!-- Body perfectly straight -->
                               <path d="M32 19 L32 32" stroke="#9c27b0" stroke-width="3"/>
                               <!-- Arms at sides, perfectly steady -->
                               <path d="M32 20 L28 28" stroke="#9c27b0" stroke-width="2"/>
                               <path d="M32 20 L36 28" stroke="#9c27b0" stroke-width="2"/>
                               <!-- Hands steady as rock -->
                               <circle cx="28" cy="28" r="1.5" fill="#00bcd4"/>
                               <circle cx="36" cy="28" r="1.5" fill="#00bcd4"/>
                               <!-- Perfect balance stance -->
                               <path d="M32 32 L30 44" stroke="#9c27b0" stroke-width="2"/>
                               <path d="M32 32 L34 44" stroke="#9c27b0" stroke-width="2"/>
                               <!-- Steel reinforcement visual -->
                               <rect x="30" y="24" width="4" height="1" fill="#00bcd4"/>
                               <rect x="30" y="30" width="4" height="1" fill="#00bcd4"/>
                               <!-- Steady lines (no tremor) -->
                               <path d="M16 20 L24 20 M40 20 L48 20" stroke="#00bcd4" stroke-width="1" opacity="0.8"/>
                               <path d="M16 32 L24 32 M40 32 L48 32" stroke="#00bcd4" stroke-width="1" opacity="0.8"/>
                               <!-- Unshakeable indicator -->
                               <text x="20" y="12" font-size="3" fill="#00bcd4">💪</text>
                               <text x="44" y="40" font-size="3" fill="#00bcd4">⛰️</text></svg>