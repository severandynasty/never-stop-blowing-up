<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Front upper triangle -->
  <polygon points="50,15 70,40 30,40" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
  <!-- Front lower triangle -->
  <polygon points="30,40 70,40 50,75" fill="#e8e8e8" stroke="#333" stroke-width="2"/>
  <!-- Left face -->
  <polygon points="30,40 50,15 20,30" fill="#e0e0e0" stroke="#333" stroke-width="2"/>
  <!-- Right face -->
  <polygon points="70,40 80,30 50,15" fill="#d0d0d0" stroke="#333" stroke-width="2"/>
  <!-- Left lower -->
  <polygon points="30,40 20,65 50,75" fill="#d5d5d5" stroke="#333" stroke-width="2"/>
  <!-- Right lower -->
  <polygon points="70,40 50,75 80,65" fill="#c8c8c8" stroke="#333" stroke-width="2"/>
  <!-- Number 20 -->
  <text x="50" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">20</text>
</svg>