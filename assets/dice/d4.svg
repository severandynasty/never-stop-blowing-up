<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Front face -->
  <polygon points="50,15 20,75 80,75" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
  <!-- Left face (darker for 3D effect) -->
  <polygon points="50,15 20,75 35,45" fill="#e0e0e0" stroke="#333" stroke-width="2"/>
  <!-- Right face (darkest for 3D effect) -->
  <polygon points="50,15 80,75 65,45" fill="#d0d0d0" stroke="#333" stroke-width="2"/>
  <!-- Number 4 -->
  <text x="50" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">4</text>
</svg>