<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Center pentagon -->
  <polygon points="50,20 65,30 60,50 40,50 35,30" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
  <!-- Left face -->
  <polygon points="35,30 20,35 25,55 40,50" fill="#e0e0e0" stroke="#333" stroke-width="2"/>
  <!-- Right face -->
  <polygon points="65,30 80,35 75,55 60,50" fill="#d0d0d0" stroke="#333" stroke-width="2"/>
  <!-- Bottom left -->
  <polygon points="25,55 30,75 45,70 40,50" fill="#d5d5d5" stroke="#333" stroke-width="2"/>
  <!-- Bottom right -->
  <polygon points="75,55 70,75 55,70 60,50" fill="#c8c8c8" stroke="#333" stroke-width="2"/>
  <!-- Number 12 -->
  <text x="50" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">12</text>
</svg>