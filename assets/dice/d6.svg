<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Front face -->
  <rect x="15" y="25" width="50" height="50" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
  <!-- Top face (3D perspective) -->
  <polygon points="15,25 25,15 75,15 65,25" fill="#fff" stroke="#333" stroke-width="2"/>
  <!-- Right face (darker for 3D effect) -->
  <polygon points="65,25 75,15 75,65 65,75" fill="#e0e0e0" stroke="#333" stroke-width="2"/>
  <!-- Number 6 -->
  <text x="40" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">6</text>
</svg>