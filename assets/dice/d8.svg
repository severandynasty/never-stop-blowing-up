<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Top pyramid -->
  <polygon points="50,10 25,45 75,45" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
  <!-- Bottom pyramid left -->
  <polygon points="25,45 50,80 15,65" fill="#e0e0e0" stroke="#333" stroke-width="2"/>
  <!-- Bottom pyramid right -->
  <polygon points="75,45 85,65 50,80" fill="#d0d0d0" stroke="#333" stroke-width="2"/>
  <!-- Front face -->
  <polygon points="25,45 75,45 50,80" fill="#e8e8e8" stroke="#333" stroke-width="2"/>
  <!-- Number 8 -->
  <text x="50" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">8</text>
</svg>