<form class="{{cssClass}}" autocomplete="off">
  <header class="sheet-header">
    <h1><input name="name" type="text" value="{{name}}" /></h1>
  </header>

  <section class="sheet-body">
    <div class="field">
      <label>Blast Radius</label>
      <input type="number" name="system.blastRadius" value="{{system.blastRadius}}" />
    </div>
    <div class="field">
      <label>Fuse Time</label>
      <input type="number" name="system.fuseTime" value="{{system.fuseTime}}" />
    </div>
    <div class="field">
      <label>Damage</label>
      <input type="number" name="system.damage" value="{{system.damage}}" />
      <button type="button" class="roll-damage">🎲 Roll Damage</button>
    </div>
  </section>
</form>
